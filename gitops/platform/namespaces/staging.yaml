apiVersion: v1
kind: Namespace
metadata:
  name: apps-staging
  labels:
    idp.tfg/environment: staging
    # Pod Security Admission: se impone "baseline" y se avisa de lo que incumpla "restricted".
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
# Valores por defecto para contenedores que no declaren recursos.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-resources
  namespace: apps-staging
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 256Mi
---
# Tope del entorno: protege la memoria del equipo anfitrión (RNF de recursos, PEC1 §3.3).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
  namespace: apps-staging
spec:
  hard:
    pods: "20"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 3Gi
