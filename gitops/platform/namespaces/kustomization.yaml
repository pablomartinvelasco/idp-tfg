# Namespaces de los entornos lógicos de las aplicaciones (O3, RF-04).
# Los gestiona Argo CD (Application env-namespaces, proyecto "platform"; gitops/platform/apps).
# En S3 se aplicaron con kubectl; Argo CD adoptó esos objetos sin recrearlos. Ver ADR-0003.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: idp-lab
      app.kubernetes.io/managed-by: idp-platform
resources:
  - dev.yaml
  - staging.yaml
