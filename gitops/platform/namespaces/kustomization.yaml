# Namespaces de los entornos lógicos de las aplicaciones (O3, RF-04).
# S3/S4: se aplican con `make namespaces`. Desde S5 los gestiona Argo CD (proyecto
# "platform"), que adopta los recursos existentes sin recrearlos. Ver ADR-0003.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: idp-lab
      app.kubernetes.io/managed-by: idp-platform
resources:
  - dev.yaml
  - staging.yaml
