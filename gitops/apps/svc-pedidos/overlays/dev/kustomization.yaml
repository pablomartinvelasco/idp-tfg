# svc-pedidos en dev. Argo CD genera la Application svc-pedidos-dev (ApplicationSet "services").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps-dev
resources:
  - ../../base
labels:
  - pairs:
      idp.tfg/environment: dev
    includeTemplates: true
replicas:
  - name: svc-pedidos
    count: 1
images:
  - name: ghcr.io/pablomartinvelasco/svc-pedidos
    newTag: 38196b831786108b0746df75020e47b7cd80e09c
patches:
  - target:
      kind: Deployment
      name: svc-pedidos
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0
        value: {name: APP_ENV, value: dev}
  - target:
      kind: Ingress
      name: svc-pedidos
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: svc-pedidos.dev.localtest.me
