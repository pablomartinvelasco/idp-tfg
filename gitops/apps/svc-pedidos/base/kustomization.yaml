# Despliegue común de svc-pedidos (código: github.com/pablomartinvelasco/svc-pedidos).
# Los overlays fijan entorno, réplicas, hostname y etiqueta de imagen (ADR-0004).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: svc-pedidos
      # Permite al plugin de Kubernetes de Backstage localizar los recursos del componente.
      backstage.io/kubernetes-id: svc-pedidos
    includeSelectors: true
  # También en los pods (sin tocar los selectores): útil para filtrar métricas y listados.
  - pairs:
      app.kubernetes.io/part-of: tienda-demo
    includeTemplates: true
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
