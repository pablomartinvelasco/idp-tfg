apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-pedidos
spec:
  replicas: 1
  revisionHistoryLimit: 3
  template:
    metadata:
      annotations:
        # Descubrimiento por anotaciones; en S10 se sustituye por un ServiceMonitor.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # La etiqueta (SHA del commit del servicio) la fija cada overlay: promoción por PR.
          image: ghcr.io/pablomartinvelasco/svc-pedidos
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: local
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
